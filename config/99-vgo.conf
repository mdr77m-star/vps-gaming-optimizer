# VPS Gaming Optimizer — safe low-latency profile
# Values are intentionally bounded for a small VPS serving VPN users.

# Queueing / TCP
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# Socket memory ceilings
net.core.rmem_max = 33554432
net.core.wmem_max = 33554432
net.ipv4.tcp_rmem = 4096 262144 33554432
net.ipv4.tcp_wmem = 4096 262144 33554432
net.core.optmem_max = 65535

# Accept queues / burst handling
net.core.somaxconn = 65535
net.core.netdev_max_backlog = 16384
net.ipv4.tcp_max_syn_backlog = 16384

# Connection setup / lifecycle
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_keepalive_time = 300
net.ipv4.tcp_keepalive_intvl = 30
net.ipv4.tcp_keepalive_probes = 5
net.ipv4.tcp_slow_start_after_idle = 0

# ECN: permit negotiation when both endpoints support it, do not require it.
net.ipv4.tcp_ecn = 2

# Prevent PMTU black-hole stalls while leaving normal PMTU discovery intact.
net.ipv4.tcp_mtu_probing = 1

# Lower the amount of unsent TCP data sitting in a socket before the sender is throttled.
net.ipv4.tcp_notsent_lowat = 16384

# Conntrack headroom for dozens of VPN users.
net.netfilter.nf_conntrack_max = 131072
